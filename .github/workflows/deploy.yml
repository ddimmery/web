name: Deploy

# Builds the static site and publishes it to Cloudflare Pages.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   — API token with the "Cloudflare Pages: Edit"
#                            permission for the account below. Create it at
#                            https://dash.cloudflare.com/profile/api-tokens
#   CLOUDFLARE_ACCOUNT_ID  — the account ID shown in the Cloudflare dashboard
#                            sidebar (also in any dashboard URL).
#
# The Pages project must already exist and be named `ddimmery-web`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ddimmery-web
