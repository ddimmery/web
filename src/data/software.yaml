- title: "rdd"
  description: |
    **Outdated!** Users should switch to [actively maintained and updated RD tools](https://rdpackages.github.io/).  
    Provides the tools to undertake estimation in Regression Discontinuity Designs. Both sharp and fuzzy designs are supported. Estimation is accomplished using local linear regression. A provided function will utilize Imbens-Kalyanaraman optimal bandwidth calculation. A function is also included to test the assumption of no-sorting effects.
  github: https://github.com/ddimmery/rdd
  package: https://cran.r-project.org/package=rdd
- title: "regweight"
  description: |
    The goal of `regweight` is to make it easy to diagnose a model using Aronow and Samii (2015) regression weights.  
    In short, these weights show which observations are most influential for determining the observed value of a coefficient in a linear regression. If the linear regression is aiming to estimate causal effects, this implies that the OLS estimand may differ from the average treatment effect. These linear regression weights provide, in some sense, the most precise estimate available given a conditioning set (and a linear model). These weights are in expectation the conditional variance of the variable of interest (given the other covariates in the model).
  website: https://ddimmery.github.io/regweight/
  github: https://github.com/ddimmery/regweight
  package: https://cran.r-project.org/package=regweight
- title: "tidyhte"
  description: |
    `tidyhte` provides tidy semantics for estimation of heterogeneous treatment effects through the use of Kennedy's (n.d.) doubly-robust learner.  
    The goal of `tidyhte` is to use a sort of “recipe” design. This should (hopefully) make it extremely easy to scale an analysis of HTE from the common single-outcome / single-moderator case to many outcomes and many moderators. The configuration of `tidyhte` should make it extremely easy to perform the same analysis across many outcomes and for a wide-array of moderators. It’s written to be fairly easy to extend to different models and to add additional diagnostics and ways to output information from a set of HTE estimates.
  website: https://ddimmery.github.io/tidyhte/
  github: https://github.com/ddimmery/tidyhte
- title: "bwd"
  description: |
    `bwd` provides a reference implementation of the Balancing Walk Design for online experimental design, from [Arbour, Dimmery, Mai & Rao (ICML 2022)](https://proceedings.mlr.press/v162/arbour22a.html).  
    When units arrive one at a time and must be assigned to treatment immediately, standard randomization can leave substantial covariate imbalance. `bwd` assigns treatment in a streaming fashion so that covariates remain balanced throughout the experiment, controlling imbalance substantially better than i.i.d. randomization while retaining the robustness of a randomized design.
  website: https://ddimmery.github.io/balancer-package/
  github: https://github.com/ddimmery/balancer-package
  package: https://pypi.org/project/bwd/
- title: "pytest-stochastic"
  description: |
    `pytest-stochastic` is a pytest plugin that replaces ad-hoc stochastic tests with tests backed by concentration inequalities.  
    Instead of hand-picking a sample count and tolerance and hoping the test isn't flaky, you declare the statistical assumptions and an acceptable failure probability; the plugin automatically selects an appropriate concentration bound (Hoeffding, Bernstein, sub-Gaussian and others) and computes the sample size required to meet it. It includes decorators for mean and distributional tests, a tune mode for empirically profiling variance, and automatic seed management for reproducibility. See [the announcement post](/posts/pytest-stochastic/) for the motivation.
  website: https://ddimmery.github.io/pytest-stochastic/
  github: https://github.com/ddimmery/pytest-stochastic
  package: https://pypi.org/project/pytest-stochastic/
